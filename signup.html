<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - Sign Up</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 flex items-center justify-center min-h-screen">

    <div class="bg-white w-[380px] p-3 rounded-2xl shadow-xl">

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-center text-blue-600">
            📚 Study Planner
        </h1>
        <p class="text-center text-gray-500 mt-2">
            Create Your Account
        </p>
        <form class="mt-6" onsubmit="return validateForm()">
            <!-- Full Name -->
            <label class="block font-semibold text-gray-700 mb-2">
                Full Name
            </label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
            >
            <!-- Email -->
            <label class="block font-semibold text-gray-700 mb-2">
                Email
            </label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
            >
            <!-- Password -->
            <label class="block font-semibold text-gray-700 mb-2">
                Password
            </label>
            <div class="relative mb-4">
                <input
                    type="password"
                    id="password"
                    placeholder="Create Password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <span
                    onclick="showPassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-xl"
                >
                    👁️
                </span>
            </div>
            <!-- Confirm Password -->
            <label class="block font-semibold text-gray-700 mb-2">
                Confirm Password
            </label>
            <div class="relative">
                <input
                    type="password"
                    id="confirm"
                    placeholder="Confirm Password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <span
                    onclick="showConfirmPassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-xl"
                >
                    👁️
                </span>
            </div>
            <!-- Signup Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold mt-6 transition duration-300"
            >
                Sign Up
            </button>
            <!-- Login Link -->
            <p class="text-center text-gray-600 mt-5">
                Already have an account?
                <a href="index.html" class="text-blue-600 font-semibold hover:underline">
                    Login
                </a>
            </p>
        </form>
    </div>
    <script>
        function showPassword()
        {
            var pass = document.getElementById("password");
            if(pass.type=="password")
            {
                pass.type="text";
            }
            else
            {
                pass.type="password";
            }
        }
        function showConfirmPassword()
        {
            var confirm = document.getElementById("confirm");

            if(confirm.type=="password")
            {
                confirm.type="text";
            }
            else
            {
                confirm.type="password";
            }
        }
        function validateForm()
        {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirm = document.getElementById("confirm").value;

            if(name=="" || email=="" || password=="" || confirm=="")
            {
                alert("Please fill all fields.");
                return false;
            }

            if(password!=confirm)
            {
                alert("Password does not match.");
                return false;
            }

            alert("Account Created Successfully!");
            return true;
        }
    </script>
</body>
</html>
